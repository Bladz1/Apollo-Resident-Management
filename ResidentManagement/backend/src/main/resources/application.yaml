jwt:
  signerKey: ${JWT_SIGNER_KEY}
  valid-duration: 86400
  refreshable-duration: 604800

server:
  port: 8080
  servlet:
    context-path: /resident-management

spring:
  datasource:
    url: ${DBMS_CONNECTION}
    driverClassName: "com.mysql.cj.jdbc.Driver"
    username: ${DBMS_USERNAME}
    password: ${DBMS_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: localhost
      port: 6379

file:
  uploadDir: uploads/
  baseUrl: ${FILE_BASE_URL:http://localhost:8080/resident-management}

payos:
  client-id: ${PAYOS_CLIENT_ID}
  api-key: ${PAYOS_API_KEY}
  checksum-key: ${PAYOS_CHECKSUM_KEY}